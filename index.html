<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ea"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>The Duhig-Hyde Cook Book</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>OUR FAMILY RECIPES</small><h1>The Duhig-Hyde<br>Cook Book</h1></div><button id="addTop" class="round">＋</button></header><main><input id="search" placeholder="Search recipes or ingredients…"><div id="cats" class="chips"></div><section id="recipes" class="grid"></section><section id="shopping" class="panel hidden"><div class="panelHead"><h2>Shopping List</h2><button id="clearShop">Clear</button></div><div id="shopItems"></div></section></main><nav><button data-view="recipes" class="active">⌂<span>Recipes</span></button><button data-view="favs">♡<span>Favourites</span></button><button data-view="shopping">☷<span>Shopping</span></button><button id="toolsNav">⇧<span>Import/Backup</span></button><button id="addNav">＋<span>Add</span></button></nav><dialog id="modal"><form id="recipeForm" method="dialog"><div class="modalHead"><button type="button" id="cancel">Cancel</button><h2 id="formTitle">Add Recipe</h2><button type="submit">Save</button></div><input type="hidden" id="rid"><label>Recipe name<input id="name" required></label><div class="row"><label>Category<input id="category" placeholder="Pasta"></label><label>Serves<input id="serves" type="number" min="1" value="4"></label></div><label>Ingredients <small>(one per line)</small><textarea id="ingredients" rows="8" required></textarea></label><label>Method <small>(one step per line)</small><textarea id="method" rows="8" required></textarea></label></form></dialog><dialog id="tools"><article><div class="modalHead"><button type="button" id="closeTools">Close</button><h2>Import & Backup</h2><span></span></div><h3>Import a recipe</h3><p class="hint">Paste a Duhig-Hyde recipe block below, then tap Import Recipe.</p><textarea id="importText" rows="12" placeholder="Name: Tomato, Olive & Herb Bruschetta&#10;Category: Starters & Sides&#10;Serves: 4&#10;&#10;Ingredients:&#10;- 300g cherry tomatoes...&#10;&#10;Method:&#10;1. Mix...&#10;&#10;Note: Best served immediately."></textarea><div class="actions"><button id="importBtn">Import Recipe</button></div><hr><h3>Backup your cookbook</h3><p class="hint">Export saves all recipes to a JSON backup file. Import Backup restores recipes from one of those files.</p><div class="actions"><button id="exportBtn">Export Backup</button><button id="backupImportBtn" class="secondary">Import Backup</button></div><input id="backupFile" type="file" accept="application/json,.json" hidden></article></dialog><dialog id="detail"><article id="detailBody"></article></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
